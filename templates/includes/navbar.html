{% load static %}
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
</head>

<header class="header-modern">
    <!-- Top Announcement Bar -->
    <div class="announcement-bar">
        <div class="container">
            <div class="announcement-text">
                <i class="fas fa-truck"></i> Shipping available all over India.
            </div>
            <div class="announcement-links">
                <a href="#">About Us</a>
                <a href="#">Contact</a>
                {% if user.id %}
                <a href="{% url 'logout' %}">Logout</a>
                {% endif %}
            </div>
        </div>
    </div>

    <!-- Main Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white">
        <div class="container">
            <!-- Logo -->
            <a class="navbar-brand" href="{% url 'home' %}">
                <img src="{% static 'images/Ecovios-logo.png' %}" alt="Ecovios" class="main-logo">
            </a>

            <!-- Mobile Toggle -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Main Navigation Content -->
            <div class="collapse navbar-collapse" id="mainNavbar">
                <!-- Store Link -->
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" style="font-size: 1.2rem;" href="{% url 'store' %}">Store</a>
                    </li>
                </ul>

                <!-- Search Bar -->
                <form action="{% url 'search' %}" method="GET" class="d-flex search-form mx-3">
                    <div class="input-group search-container">
                        <input type="text" class="form-control search-input" placeholder="Search products..." name="keyword">
                        <button class="btn search-btn" type="submit">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </form>

                <!-- User Actions -->
                <div class="user-actions">
                    {% if user.id is None %}
                    <div class="auth-links">
                        <a href="{% url 'login' %}" class="btn btn-outline-secondary me-2">Login</a>
                        <a href="{% url 'register' %}" class="btn btn-primary">Register</a>
                    </div>
                    {% else %}
                    <div class="logged-in-actions">
                        <a href="{% url 'wishlist' %}" class="action-icon" title="Wishlist">
                            <i class="far fa-heart" style="font-size: 1.6rem;"></i>
                        </a>
                        <a href="{% url 'cart' %}" class="action-icon" title="Cart">
                            <i class="fas fa-shopping-cart" style="font-size: 1.6rem;"></i>
                            {% if cart_count > 0 %}
                            <span class="cart-count">{{ cart_count }}</span>
                            {% endif %}
                        </a>
                        <div class="dropdown user-dropdown">
                            <a href="#" class="user-profile dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="fas fa-user-circle" style="font-size: 1.6rem;"></i>
                                <span class="user-name">{{ user.first_name }}</span>
                            </a>
                            <div class="dropdown-menu dropdown-menu-end">
                                <a class="dropdown-item" href="{% url 'dashboard' %}">
                                    <i class="fas fa-user me-2"></i>My Account
                                </a>
                                <a class="dropdown-item" href="{% url 'edit_profile' %}">
                                    <i class="fas fa-cog me-2"></i>Settings
                                </a>
                                <div class="dropdown-divider"></div>
                                <a class="dropdown-item" href="{% url 'logout' %}">
                                    <i class="fas fa-sign-out-alt me-2"></i>Logout
                                </a>
                            </div>
                        </div>
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
</header>

<style>
    /* Modern Header Styles */
    .header-modern {
        box-shadow: 0 2px 15px rgba(0,0,0,0.08);
        position: relative;
        z-index: 1000;
    }
    
    /* Announcement Bar */
    .announcement-bar {
        background: #28a745;
        color: white;
        padding: 8px 0;
        font-size: 0.9rem;
    }
    
    .announcement-bar .container {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .announcement-text i {
        margin-right: 8px;
    }
    
    .announcement-links a {
        color: white;
        text-decoration: none;
        margin-left: 15px;
        font-size: 0.85rem;
    }
    
    .announcement-links a:hover {
        text-decoration: underline;
    }
    
    /* Main Navigation */
    .navbar {
        padding: 15px 0;
    }
    
    .main-logo {
        height: 40px;
        width: auto;
    }
    
    .nav-link {
        font-weight: 500;
        color: #333;
        padding: 8px 15px;
        transition: color 0.3s;
    }
    
    .nav-link:hover {
        color: #28a745;
    }
    
    /* Search Bar */
    .search-form {
        max-width: 350px;
        width: 100%;
        flex-grow: 0;
        margin-left: 15px;
        margin-right: 15px;
    }
    
    .search-container {
        width: 100%;
    }
    
    .search-input {
        border-radius: 6px 0 0 6px;
        border: 1px solid #e0e0e0;
        border-right: none;
        padding: 8px 12px;
    }
    
    .search-btn {
        background: #28a745;
        color: white;
        border-radius: 0 6px 6px 0;
        padding: 0 15px;
        border: none;
        transition: background 0.3s;
    }
    
    .search-btn:hover {
        background: #218838;
    }
    
    /* User Actions */
    .user-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        flex-shrink: 0;
    }
    
    .auth-links .btn {
        padding: 8px 15px;
        font-size: 0.9rem;
    }
    
    .logged-in-actions {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    
    .action-icon {
        color: #333;
        font-size: 1.2rem;
        margin: 0 12px;
        position: relative;
        transition: color 0.3s;
    }
    
    .action-icon:hover {
        color: #28a745;
    }
    
    .cart-count {
        position: absolute;
        top: -8px;
        right: -8px;
        background: #dc3545;
        color: white;
        border-radius: 50%;
        width: 18px;
        height: 18px;
        font-size: 0.7rem;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .user-dropdown {
        position: relative;
    }
    
    .user-profile {
        display: flex;
        align-items: center;
        color: #333;
        text-decoration: none;
        padding: 5px 10px;
        border-radius: 20px;
        transition: background 0.3s;
        cursor: pointer;
    }
    
    .user-profile:hover {
        background: #f8f9fa;
    }
    
    .user-name {
        margin-left: 8px;
        font-size: 1.2rem;
    }
    
    .dropdown-menu {
        min-width: 200px;
        padding: 5px 0;
        border: none;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        border-radius: 6px;
        margin-top: 8px;
        display: none;
    }
    
    .dropdown-menu-end {
        right: 0;
        left: auto;
    }
    
    .dropdown-item {
        padding: 8px 15px;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        color: #333;
    }
    
    .dropdown-item:hover {
        background-color: #f8f9fa;
        color: #28a745;
    }
    
    .dropdown-divider {
        margin: 5px 0;
    }
    
    .dropdown.show .dropdown-menu {
        display: block;
    }
    
    /* Secondary Navigation */
    .secondary-nav {
        background: #f8f9fa;
        border-top: 1px solid #e9ecef;
    }
    
    .nav-links {
        display: flex;
        list-style: none;
        margin: 0;
        padding: 0;
        overflow-x: auto;
        white-space: nowrap;
    }
    
    .nav-links li {
        margin-right: 20px;
    }
    
    .nav-links a {
        color: #333;
        text-decoration: none;
        font-size: 0.9rem;
        padding: 12px 0;
        display: inline-block;
        position: relative;
    }
    
    .nav-links a:after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 0;
        height: 2px;
        background: #28a745;
        transition: width 0.3s;
    }
    
    .nav-links a:hover:after {
        width: 100%;
    }
    
    /* Responsive Adjustments */
    @media (max-width: 992px) {
        .search-form {
            margin: 10px 0;
            max-width: 300px;
        }
        
        .user-actions {
            margin-top: 10px;
            justify-content: flex-end;
            width: auto;
            gap: 8px;
        }
        
        .logged-in-actions {
            gap: 8px;
        }
    }
    
    @media (max-width: 768px) {
        .announcement-bar .container {
            flex-direction: column;
            text-align: center;
        }
        
        .announcement-links {
            margin-top: 5px;
        }
        
        .announcement-links a {
            margin: 0 8px;
        }
        
        .search-form {
            max-width: 100%;
            margin: 10px 0;
        }
        
        .user-actions {
            justify-content: center;
            width: 100%;
        }
        
        .secondary-nav {
            display: none;
        }
    }
</style>
